name: Build CORNER-D AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VidForgeAI/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        working-directory: VidForgeAI
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: VidForgeAI
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CORNER-D-AI-debug
          path: VidForgeAI/app/build/outputs/apk/debug/app-debug.apk
